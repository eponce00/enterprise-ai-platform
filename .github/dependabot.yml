version: 2

# The platform pins a release-tested dependency set. Dependabot still opens
# grouped security updates, but routine version bumps are handled deliberately
# during a release cycle instead of creating unreviewed upgrade PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/examples/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # These tags are built by Compose and are not published registry images.
      - dependency-name: enterprise-ai-gateway
      - dependency-name: enterprise-ai-mock-provider

  - package-ecosystem: docker
    directory: /tests/e2e/mock_provider
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
